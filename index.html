<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eaeef9">
  <title>Aurora Glass</title>
  <!--
    Aurora Glass · 极光琉璃 —— XB-Probe 外部主题（公开看板）。

    硬性约束（与平台一致）：
      - 只能调用 /api/public/v1/*，无权访问管理 API；
      - 响应头 CSP 恒为 default-src 'self'（img-src 仅多放行 data:），
        因此本文件**没有**任何内联 <script>/<style>/style="..."，
        也不加载任何 CDN 资源；图标一律内联 SVG，图表用 Canvas 手绘。
      - 全部样式在 style.css，全部脚本在 app.js（都用相对路径，同源加载）。
  -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 极光背景：四团缓慢漂移的彩色光斑 + 一层噪点抑制色带。
       纯 CSS 渐变（无图片、无内联样式），prefers-reduced-motion 时静止。 -->
  <div class="aurora" aria-hidden="true">
    <i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i>
  </div>

  <header class="topbar">
    <div class="topbar-in">
      <div class="tabs" id="tabs" role="tablist" aria-label="按分组筛选节点"></div>
      <div class="topbar-right">
        <h1 class="site-title" id="site-title">Aurora Glass</h1>
        <span class="updated" id="updated"></span>
        <span class="topbar-actions">
          <a class="icon-btn" id="btn-login" href="/admin/" title="管理后台" aria-label="管理后台">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </a>
          <button class="icon-btn tgl" id="btn-theme" type="button" aria-label="切换深浅色" title="切换深浅色">
            <svg class="ico-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="ico-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </span>
      </div>
    </div>
  </header>

  <div class="wrap">

    <!-- 汇总卡（data-card 键由 settings.public.cards 三态控制显隐与列数） -->
    <section class="kpis" id="kpis" aria-label="总体汇总">
      <div class="kpi" data-card="kpi_nodes">
        <div class="kpi-head">
          <span class="kpi-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></span>
          节点
        </div>
        <div class="kpi-main">
          <b id="kpi-online">0</b><span class="kpi-sep">/</span><span class="kpi-total" id="kpi-total">0</span>
        </div>
        <div class="kpi-sub" id="kpi-offline">—</div>
      </div>

      <div class="kpi" data-card="kpi_busy">
        <div class="kpi-head">
          <span class="kpi-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-9"/></svg></span>
          最忙节点
        </div>
        <div class="kpi-main"><b id="kpi-busy-pct">—</b></div>
        <div class="kpi-sub" id="kpi-busy-name">—</div>
      </div>

      <div class="kpi" data-card="kpi_today">
        <div class="kpi-head">
          <span class="kpi-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></svg></span>
          今日流量
        </div>
        <div class="kpi-pair">
          <div><span class="dir down" aria-label="下行">↓</span><b id="kpi-today-rx">—</b></div>
          <div><span class="dir up" aria-label="上行">↑</span><b id="kpi-today-tx">—</b></div>
        </div>
        <div class="kpi-sub">
          总流量 <span class="dir down" aria-label="累计下行">↓</span><span id="kpi-total-rx">—</span>
          <span class="dir up" aria-label="累计上行">↑</span><span id="kpi-total-tx">—</span>
        </div>
      </div>

      <div class="kpi" data-card="kpi_net">
        <div class="kpi-head">
          <span class="kpi-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/></svg></span>
          实时网速
        </div>
        <div class="kpi-pair">
          <div><span class="dir down" aria-label="下行">↓</span><b id="kpi-rx">—</b></div>
          <div><span class="dir up" aria-label="上行">↑</span><b id="kpi-tx">—</b></div>
        </div>
        <canvas class="spark" id="spark" role="img" aria-label="聚合下行带宽趋势"></canvas>
      </div>

      <div class="kpi" data-card="kpi_fee">
        <div class="kpi-head">
          <span class="kpi-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg></span>
          月费合计
        </div>
        <div class="kpi-main"><b id="kpi-fee">—</b></div>
        <div class="kpi-sub" id="kpi-fee-currency">—</div>
      </div>
    </section>

    <!-- 列表视图 -->
    <main id="list-view">
      <div class="grid nodes" id="nodes" aria-live="polite"></div>
      <p class="empty-tip" id="empty-tip" hidden>当前没有对公展示的节点。</p>
    </main>

    <!-- 详情视图 -->
    <main id="detail-view" hidden>
      <button class="ghost" id="btn-back" type="button">← 返回总览</button>
      <div class="detail-head">
        <span class="n-flag" id="detail-flag"></span>
        <h2 id="detail-name">节点</h2>
        <span class="chip" id="detail-status"></span>
        <span class="chip" id="detail-expire"></span>
      </div>

      <div class="dinfo" id="detail-info"></div>

      <div class="section-head">
        <div class="tab-bar" id="detail-tabs">
          <button class="tab active" type="button" data-tab="resources">资源监控</button>
          <button class="tab" type="button" data-tab="latency">探测延迟</button>
        </div>
        <span class="spacer"></span>
        <label class="inline">时间范围
          <select id="range-select">
            <option value="30m">最近 30 分钟</option>
            <option value="1h">最近 1 小时</option>
            <option value="5h">最近 5 小时</option>
            <option value="24h" selected>最近 24 小时</option>
            <option value="7d">最近 7 天</option>
            <option value="30d">最近 30 天</option>
          </select>
        </label>
      </div>

      <div id="tab-resources" class="tab-panel">
        <div class="grid charts">
          <figure class="chart-card m-cpu">
            <figcaption><span class="cap-t"><i class="cap-dot"></i>CPU 使用率</span><span class="cap-m" id="cap-cpu">—</span></figcaption>
            <canvas class="chart" id="c-cpu" role="img" aria-label="CPU 使用率历史曲线"></canvas>
          </figure>
          <figure class="chart-card m-mem">
            <figcaption><span class="cap-t"><i class="cap-dot"></i>内存已用</span><span class="cap-m" id="cap-mem">—</span></figcaption>
            <canvas class="chart" id="c-mem" role="img" aria-label="内存已用历史曲线"></canvas>
          </figure>
          <figure class="chart-card m-net">
            <figcaption><span class="cap-t"><i class="cap-dot"></i>网络速率</span><span class="cap-m" id="cap-net">—</span></figcaption>
            <canvas class="chart" id="c-net" role="img" aria-label="上下行带宽历史曲线"></canvas>
          </figure>
          <figure class="chart-card m-disk">
            <figcaption><span class="cap-t"><i class="cap-dot"></i>磁盘已用</span><span class="cap-m" id="cap-disk">—</span></figcaption>
            <canvas class="chart" id="c-disk" role="img" aria-label="磁盘已用历史曲线"></canvas>
          </figure>
        </div>
      </div>

      <div id="tab-latency" class="tab-panel" hidden>
        <figure class="chart-card m-lat wide">
          <figcaption><span class="cap-t"><i class="cap-dot"></i>各目标 RTT</span><span class="cap-m" id="cap-latency">—</span></figcaption>
          <canvas class="chart" id="c-latency" role="img" aria-label="各探测目标延迟曲线"></canvas>
          <div class="legend" id="latency-legend"></div>
        </figure>

        <div class="section-head"><h3>延迟明细</h3></div>
        <div class="grid cards-3" id="latency-list"></div>
      </div>
    </main>

    <footer class="foot-bar">
      <span class="foot-status" id="foot-status"></span>
      <label class="foot-refresh">刷新间隔
        <select id="refresh-interval">
          <option value="1">1 秒</option>
          <option value="3" selected>3 秒</option>
          <option value="5">5 秒</option>
          <option value="10">10 秒</option>
          <option value="30">30 秒</option>
        </select>
      </label>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
